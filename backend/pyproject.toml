[project]
name = "weather-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Vincent Eichhorn",email = "vincent.eichhorn@student.hpi.de"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "weather-forecast @ ../forecast",
    "torch"
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"